<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" width="1100" height="700">
<title>Chapter 7 – CI/CD Flow</title>

<style>
  .box { fill: #efeaf8; stroke: #6b5fa5; stroke-width: 1.6; rx: 8; ry: 8; }
  .box-key { fill: #ffe9c2; stroke: #b87f1c; stroke-width: 1.6; rx: 8; ry: 8; }
  .box-alert { fill: #fad5d5; stroke: #b53939; stroke-width: 1.6; rx: 8; ry: 8; }
  .box-good { fill: #d3eee0; stroke: #2f8260; stroke-width: 1.6; rx: 8; ry: 8; }
  .box-start { fill: #d6e4fa; stroke: #2d5dad; stroke-width: 1.8; rx: 8; ry: 8; }
  .lbl { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
         font-size: 13px; fill: #1a1a1a; text-anchor: middle; }
  .lbl-bold { font-weight: 600; }
  .lbl-small { font-size: 11px; fill: #555; }
  .edge { stroke: #444; stroke-width: 1.4; fill: none; }
  .edge-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
                font-size: 11px; fill: #444; text-anchor: middle; }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#444"/>
  </marker>
</defs>

<rect width="1100" height="700" fill="white"/>
<rect x="30" y="30" width="120" height="36" class="box-start"/>
<text x="90.0" y="52.0" class="lbl lbl-bold">Developer</text>
<rect x="160" y="30" width="120" height="36" class="box-start"/>
<text x="220.0" y="52.0" class="lbl lbl-bold">Git Repo</text>
<rect x="290" y="30" width="120" height="36" class="box-start"/>
<text x="350.0" y="52.0" class="lbl lbl-bold">GitHub Actions</text>
<rect x="420" y="30" width="120" height="36" class="box-start"/>
<text x="480.0" y="52.0" class="lbl lbl-bold">Code Check</text>
<rect x="550" y="30" width="120" height="36" class="box-start"/>
<text x="610.0" y="52.0" class="lbl lbl-bold">Tests</text>
<rect x="680" y="30" width="120" height="36" class="box-start"/>
<text x="740.0" y="52.0" class="lbl lbl-bold">Build</text>
<rect x="810" y="30" width="120" height="36" class="box-start"/>
<text x="870.0" y="52.0" class="lbl lbl-bold">Claude Review</text>
<rect x="940" y="30" width="120" height="36" class="box-start"/>
<text x="1000.0" y="52.0" class="lbl lbl-bold">Deploy Env</text>
<line x1="90.0" y1="66" x2="90.0" y2="670" stroke="#ccc" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="220.0" y1="66" x2="220.0" y2="670" stroke="#ccc" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="350.0" y1="66" x2="350.0" y2="670" stroke="#ccc" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="480.0" y1="66" x2="480.0" y2="670" stroke="#ccc" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="610.0" y1="66" x2="610.0" y2="670" stroke="#ccc" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="740.0" y1="66" x2="740.0" y2="670" stroke="#ccc" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="870.0" y1="66" x2="870.0" y2="670" stroke="#ccc" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="1000.0" y1="66" x2="1000.0" y2="670" stroke="#ccc" stroke-width="1" stroke-dasharray="3,3"/>
<path d="M 90.0 90 L 220.0 90" class="edge" marker-end="url(#arrow)"/>
<rect x="96.0" y="73" width="118" height="15" fill="white" opacity="0.85"/>
<text x="155.0" y="84" class="edge-label">Developer push</text>
<path d="M 220.0 130 L 350.0 130" class="edge" marker-end="url(#arrow)"/>
<rect x="178.0" y="113" width="214" height="15" fill="white" opacity="0.85"/>
<text x="285.0" y="124" class="edge-label">Webhook → trigger workflow</text>
<path d="M 350.0 180 L 480.0 180" class="edge" marker-end="url(#arrow)"/>
<rect x="372.0" y="163" width="86" height="15" fill="white" opacity="0.85"/>
<text x="415.0" y="174" class="edge-label">Run Linter</text>
<path d="M 480.0 220 L 350.0 220" class="edge" marker-end="url(#arrow)"/>
<rect x="388.0" y="203" width="54" height="15" fill="white" opacity="0.85"/>
<text x="415.0" y="214" class="edge-label">Result</text>
<path d="M 350.0 270 L 610.0 270" class="edge" marker-end="url(#arrow)"/>
<rect x="421.0" y="253" width="118" height="15" fill="white" opacity="0.85"/>
<text x="480.0" y="264" class="edge-label">Run unit tests</text>
<path d="M 610.0 310 L 350.0 310" class="edge" marker-end="url(#arrow)"/>
<rect x="453.0" y="293" width="54" height="15" fill="white" opacity="0.85"/>
<text x="480.0" y="304" class="edge-label">Result</text>
<path d="M 350.0 360 L 740.0 360" class="edge" marker-end="url(#arrow)"/>
<rect x="482.0" y="343" width="126" height="15" fill="white" opacity="0.85"/>
<text x="545.0" y="354" class="edge-label">Compile / build</text>
<path d="M 740.0 400 L 350.0 400" class="edge" marker-end="url(#arrow)"/>
<rect x="518.0" y="383" width="54" height="15" fill="white" opacity="0.85"/>
<text x="545.0" y="394" class="edge-label">Result</text>
<path d="M 350.0 450 L 870.0 450" class="edge" marker-end="url(#arrow)"/>
<rect x="523.0" y="433" width="174" height="15" fill="white" opacity="0.85"/>
<text x="610.0" y="444" class="edge-label">Trigger Claude review</text>
<path d="M 870.0 490 L 350.0 490" class="edge" marker-end="url(#arrow)"/>
<rect x="543.0" y="473" width="134" height="15" fill="white" opacity="0.85"/>
<text x="610.0" y="484" class="edge-label">Add review notes</text>
<path d="M 350.0 540 L 1000.0 540" class="edge" marker-end="url(#arrow)"/>
<rect x="564.0" y="523" width="222" height="15" fill="white" opacity="0.85"/>
<text x="675.0" y="534" class="edge-label">Review passed → auto deploy</text>
<path d="M 1000.0 600 L 90.0 600" class="edge" marker-end="url(#arrow)"/>
<rect x="454.0" y="583" width="182" height="15" fill="white" opacity="0.85"/>
<text x="545.0" y="594" class="edge-label">Send completion notice</text>
<rect x="30" y="650" width="120" height="36" class="box-start"/>
<text x="90.0" y="672.0" class="lbl lbl-bold">Developer</text>
<rect x="160" y="650" width="120" height="36" class="box-start"/>
<text x="220.0" y="672.0" class="lbl lbl-bold">Git Repo</text>
<rect x="290" y="650" width="120" height="36" class="box-start"/>
<text x="350.0" y="672.0" class="lbl lbl-bold">GitHub Actions</text>
<rect x="420" y="650" width="120" height="36" class="box-start"/>
<text x="480.0" y="672.0" class="lbl lbl-bold">Code Check</text>
<rect x="550" y="650" width="120" height="36" class="box-start"/>
<text x="610.0" y="672.0" class="lbl lbl-bold">Tests</text>
<rect x="680" y="650" width="120" height="36" class="box-start"/>
<text x="740.0" y="672.0" class="lbl lbl-bold">Build</text>
<rect x="810" y="650" width="120" height="36" class="box-start"/>
<text x="870.0" y="672.0" class="lbl lbl-bold">Claude Review</text>
<rect x="940" y="650" width="120" height="36" class="box-start"/>
<text x="1000.0" y="672.0" class="lbl lbl-bold">Deploy Env</text>
</svg>