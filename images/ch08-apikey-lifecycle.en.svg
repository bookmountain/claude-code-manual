<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 2000" width="1100" height="2000">
<title>Chapter 8 – API Key Lifecycle</title>

<style>
  .box { fill: #efeaf8; stroke: #6b5fa5; stroke-width: 1.6; rx: 8; ry: 8; }
  .box-key { fill: #f5a623; stroke: #b87f1c; stroke-width: 1.6; rx: 8; ry: 8; }
  .box-alert { fill: #d44141; stroke: #8d2020; stroke-width: 1.6; rx: 8; ry: 8; }
  .box-good { fill: #4caf50; stroke: #2f6e36; stroke-width: 1.6; rx: 8; ry: 8; }
  .box-start { fill: #2d6cd6; stroke: #1a4a99; stroke-width: 1.8; rx: 8; ry: 8; }
  .lbl { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
         font-size: 14px; fill: #1a1a1a; text-anchor: middle; }
  .lbl-white { fill: #ffffff; font-weight: 600; }
  .lbl-bold { font-weight: 600; }
  .edge { stroke: #444; stroke-width: 1.4; fill: none; }
  .edge-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
                font-size: 12px; fill: #444; text-anchor: middle; }
</style>
<defs>
